name: Supabase keepalive

# Free-tier Supabase projects auto-pause after ~7 days without DATABASE
# activity. An edge-rejected ping to /rest/v1/ (401) does NOT count — the
# project paused on ~2026-08-08 despite green pings every 2 days. This runs
# a real table query through PostgREST instead. Manual run also available.

on:
  schedule:
    - cron: '0 6 */2 * *' # 06:00 UTC, every 2nd day
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a table so the DB registers activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"
          # `|| true` so a curl DNS failure (exit 6, paused project) reaches
          # the check below instead of killing the script via set -e.
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/visited_pubs?select=*&limit=1" || true)
          echo "GET /rest/v1/visited_pubs -> HTTP ${code:-000}"
          if [ "${code:-000}" != "200" ]; then
            echo "Response body:"; cat /tmp/body 2>/dev/null || true; echo
            echo "Keepalive FAILED. HTTP 000 means DNS is gone — the project is paused."
            echo "Restore it at https://supabase.com/dashboard/project/whljrvgryplxxjcwkwuy"
            exit 1
          fi
          echo "Keepalive OK — real query executed."
