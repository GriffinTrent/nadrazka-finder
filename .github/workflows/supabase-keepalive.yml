name: Supabase keepalive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which
# breaks magic-link auth and the visited-pubs sync. This pings the project's
# REST + auth API every 2 days so it stays active. Manual run also available.

on:
  schedule:
    - cron: '0 6 */2 * *' # 06:00 UTC, every 2nd day
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST + auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret"; exit 1
          fi
          # A REST request hits PostgREST/DB and counts as activity.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          echo "REST /rest/v1/ -> HTTP ${code}"
          # Any HTTP response (even 401/404) means the project is awake and reachable.
          if [ "${code}" = "000" ]; then
            echo "Project unreachable (DNS/paused). Restore it in the Supabase dashboard."; exit 1
          fi
          # Also touch the auth endpoint the magic link uses.
          acode=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")
          echo "auth /auth/v1/health -> HTTP ${acode}"
          echo "Keepalive ping OK."
